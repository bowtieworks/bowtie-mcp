[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bowtie-mcp"
version = "0.1.0"
description = "MCP server for the Bowtie control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "bowtie", "zero-trust", "network-access", "ztna"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bowtieworks/bowtie-mcp"
Repository = "https://github.com/bowtieworks/bowtie-mcp"

[project.scripts]
bowtie-mcp = "bowtie_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bowtie_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.30.0",
]
